      height: 180px;

    }

      border-radius: 10px;

      letter-spacing: 3px;
      color: #6ea2ff;

    #question {

      color: #fff;
      line-height: 1.4;
      font-size: 21px;
    }

    .option {
      display: block;
      background: #151b25;
      border: 1px solid #252e3b;
      color: #dce2ea;
      padding: 14px;
      margin: 9px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
    }

    .option:hover {
      background: #1b2431;
      border-color: #3b82f6;
      transform: translateX(3px);
    }

    .correct {
      background: #166534 !important;
      border-color: #22c55e !important;
      color: #fff !important;
    }

    .wrong {
      background: #991b1b !important;
      border-color: #ef4444 !important;
      color: #fff !important;
    }

      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button:hover {
      background: linear-gradient(90deg, #1d4ed8, #4338ca);
    }

    .result {
      text-align: center;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .quiz-header, .quiz-container { padding: 22px; }
    }


    .progress {
      width: min(650px, 100%);
      color: #8f9aaa;
      font-size: 13px;
      text-align: right;
      margin-bottom: -12px;
    }

      color: #f0c75e;
    }

      padding: 11px 13px;

      background: #0e141d;
      border-left: 3px solid #526174;
      color: #b9c4d3;
      font-size: 13px;
      line-height: 1.5;
      cursor: default;
    }

      display: block;
      color: #fff;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .option-wrap {
      margin-bottom: 10px;
    }

    .option-wrap .option {
      margin: 0;
    }

    .selected {
      outline: 2px solid rgba(255,255,255,.15);
    }

    #nextButton:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    }

      margin-top: 10px;
      color: #8f9aaa;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .progress { font-size: 12px; }

.hint-box,
.hint-button,
.hint,
button[onclick*="hint"],
button[onclick*="Hint"] {
    display: none !important;
}

function loadQuestion() {
  const q = quiz[current];

  document.getElementById("progress").innerText =
    `Questão ${current + 1} de ${quiz.length}`;

  document.getElementById("question").innerText = q.pergunta;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  const nextButton = document.getElementById("nextButton");
  nextButton.disabled = true;
  nextButton.innerText =
    current === quiz.length - 1 ? "Ver resultado" : "Próxima questão";

  q.alternativas.forEach((alt, index) => {
    const wrap = document.createElement("div");
    wrap.classList.add("option-wrap");

    const btn = document.createElement("div");
    btn.classList.add("option");
    btn.innerText = alt;
    btn.onclick = () => selectOption(index, btn);

    wrap.appendChild(btn);
    optionsDiv.appendChild(wrap);
  });

  answered = false;
}

function selectOption(index, element) {
  if (answered) return;

  const q = quiz[current];
  const correctIndex = q.resposta;
  const options = document.querySelectorAll(".option");
  const wrappers = document.querySelectorAll(".option-wrap");

  answered = true;

  if (index === correctIndex) {
    element.classList.add("correct");
    score++;
  } else {
    element.classList.add("wrong");
    options[correctIndex].classList.add("correct");
  }

  element.classList.add("selected");

  // Exibe a explicação individual de cada uma das quatro alternativas.
  wrappers.forEach((itemWrap, i) => {
    if (i !== index && i !== correctIndex) return;

    const feedback = document.createElement("div");
    feedback.classList.add("feedback");

    const title = document.createElement("span");
    title.classList.add("feedback-title");

    if (i === index && index === correctIndex) {
      title.innerText = "✓ Por que sua resposta está correta?";
    } else if (i === index) {
      title.innerText = "✗ Por que sua resposta está errada?";
    } else {
      title.innerText = "✓ Por que esta é a resposta correta?";
    }

    const text = document.createElement("span");
    text.innerText = explanations[current][i];

    feedback.appendChild(title);
    feedback.appendChild(text);
    itemWrap.appendChild(feedback);
  });

  document.getElementById("nextButton").disabled = false;
}

function nextQuestion() {
  if (!answered) {
    alert("Responda antes de continuar!");
    return;
  }

  current++;

  if (current < quiz.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const percentage = Math.round((score / quiz.length) * 100);

  let message = "Continue revisando os conteúdos dos PDFs.";
  if (percentage >= 90) {
    message = "Excelente! Você está muito bem preparado.";
  } else if (percentage >= 70) {
    message = "Muito bom! Vale revisar os assuntos em que você teve dúvida.";
  } else if (percentage >= 50) {
    message = "Bom começo! Faça outra rodada e revise os conceitos que errou.";
  }

  document.querySelector(".quiz-container").innerHTML = `
    <div class="result">
      <h2>Resultado</h2>
      <p>Você acertou ${score} de ${quiz.length} questões!</p>
      <p class="score-mini">${percentage}% de aproveitamento</p>
      <p>${message}</p>
      <button onclick="location.reload()">Refazer quiz</button>
    </div>
  `;
}

loadQuestion();
